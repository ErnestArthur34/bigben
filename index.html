/* Offline support: Firestore keeps a local copy of the data and queues writes while offline.

   (immediately when offline) and the change carries on syncing in the background. */

 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=name+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};

try{if(firebaseConfig.apiKey.startsWith('YOUR'))throw 0;const app=initializeApp(firebaseConfig);auth=getAuth(app);try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(_){db=getFirestore(app)}onSnapshot(doc(db,'settings','shop'),s=>{st.cfg=s.data()||{};render()},()=>{})}catch(e){document.getElementById('app').innerHTML='<div class="card auth"><h2>Firebase is not configured</h2><p class="mu">Open index.html and paste your Firebase web config into <code>firebaseConfig</code>.</p></div>'}

 pub=onSnapshot(doc(db,'users',u.uid),s=>{const was=st.me&&st.me.role&&st.me.active,ob=st.me?.branch;st.me=s.exists()?{id:s.id,...s.data()}:{id:u.uid,role:null};
  const ok=st.me.role&&st.me.active!==false&&(st.me.role==='admin'||st.me.branch);
  if(ok&&!was){start()}else if(ok&&ob!==st.me.branch){watchBranch()}else if(!ok){clear(subs);clear(bsubs)}render()},e=>toast(e.message))});

  onSnapshot(collection(db,'stock'),{includeMetadataChanges:true},s=>{st.allStock={};s.docs.forEach(d=>st.allStock[d.id]=d.data().qty);st.pend.a=s.metadata.hasPendingWrites;render()},e=>toast(e.message)),
  onSnapshot(query(collection(db,'movements'),orderBy('ts','desc'),limit(300)),s=>{st.moves=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>toast(e.message)));
 watchBranch()}

 if(b&&b!=='all')bsubs.push(onSnapshot(query(collection(db,'stock'),where('branch','==',b)),{includeMetadataChanges:true},s=>{st.pend.k=s.metadata.hasPendingWrites;st.stock={};s.docs.forEach(d=>st.stock[d.data().product]=d.data().qty);render()},e=>toast(e.message)));

 st.refunds=[];if(b&&st.me.role!=='cashier')bsubs.push(onSnapshot(b==='all'?collection(db,'refunds'):query(collection(db,'refunds'),where('branch','==',b)),s=>{st.refunds=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,c)=>ms(c.ts)-ms(a.ts));render()},e=>toast(e.message)));

function prodV(){const b=brId(),e=st.ed?prod(st.ed)||{}:{},ok=b&&b!=='all';
 return `<div class="card"><h3>${e.id?'Edit product':'New product'}</h3><form class="fm row" data-s="prod"><input type="hidden" name="id" value="${e.id||''}">

${st.me.role!=='cashier'?`<div class="card"><h3>Refunds</h3><div class="tw"><table><tr><th>Refund</th><th>Date</th><th>Sale</th><th>By</th><th>Reason</th><th class="r">Amount</th><th></th></tr>${rfs.map(r=>`<tr><td>${r.no}</td><td>${new Date(ms(r.ts)).toLocaleString()}</td><td>${r.saleNo}</td><td>${esc(r.uname)}</td><td>${esc(r.reason)}</td><td class="r">-${cur(r.total)}</td><td><button data-a="rrcpt" data-id="${r.id}">Reprint</button></td></tr>`).join('')||'<tr><td colspan="7" class="mu">No refunds yet.</td></tr>'}</table></div></div>`:''}`}

<td><select ${self?'disabled':''} data-c="active" data-id="${u.id}"><option value="1" ${u.active!==false?'selected':''}>Active</option><option value="0" ${u.active===false?'selected':''}>Disabled</option></select></td></tr>`}).join('')}</table></div></div>`;

function rcptV(s){const c=st.cfg;return `<div class="modal" data-a="closerc"><div class="card rc" id="rcpt"><div class="ctr"><b style="font-size:16px">${esc(c.name||appName())}</b><br>${esc(c.addr||'')}${c.tel?'<br>Tel: '+esc(c.tel):''}<br>${esc(bname(s.branch))}</div><hr>
${s.refund?'<div class="ctr"><b>REFUND RECEIPT</b></div>':''}<div class="rw"><span>${s.refund?'Refund no.':'Receipt'}</span><span>${s.no}</span></div>${s.refund?`<div class="rw"><span>Original sale</span><span>${s.saleNo}</span></div>`:''}<div class="rw"><span>Date</span><span>${new Date(ms(s.ts)).toLocaleString()}</span></div><div class="rw"><span>Cashier</span><span>${esc(s.uname)}</span></div><div class="rw"><span>Sale type</span><span>${s.mode}</span></div>${s.customer?`<div class="rw"><span>Customer</span><span>${esc(s.customer)}</span></div>`:''}<hr>
${s.items.map(i=>`<div>${esc(i.name)}</div><div class="rw"><span>${i.qty} × ${cur(i.price)}</span><span>${cur(i.qty*i.price)}</span></div>`).join('')}<hr>
<div class="rw"><b>${s.refund?'REFUND TOTAL':'TOTAL'}</b><b>${s.refund?'-':''}${cur(s.total)}</b></div><div class="rw"><span>${s.refund?'Refunded via':'Paid by'}</span><span>${esc(s.pay)}</span></div>${s.refund&&s.reason?`<div>Reason: ${esc(s.reason)}</div>`:''}${s.tend&&!s.refund?`<div class="rw"><span>Received</span><span>${cur(s.tend)}</span></div><div class="rw"><span>Change</span><span>${cur(s.tend-s.total)}</span></div>`:''}<hr><div class="ctr">${esc(c.foot??'Thank you for shopping with us!')}</div>
<div class="noprint" style="display:flex;gap:8px;margin-top:14px"><button class="p" style="flex:1" data-a="print">Print</button><button style="flex:1" data-a="closerc" data-id="x">Close</button></div></div></div>`}

/* ---------- warehouse (central store) ---------- */
const loc=id=>id==='main'?'Warehouse':id==='supplier'?'Supplier':bname(id),ast=(l,p)=>st.allStock[l+'_'+p]||0;
const MT={receive:'Received',distribute:'Distributed',return:'Returned',transfer:'Transfer',adjust:'Adjustment'};
const mv=(b,type,p,qty,from,to,note)=>b.set(doc(collection(db,'movements')),{type,product:p.id,name:p.name,sku:p.sku,qty,from,to,note:note||'',uid:st.uid,uname:st.me.name,ts:new Date()});
function whV(){const ps=st.products,bs=st.branches,tf=st.tf,av=tf.p&&tf.f?ast(tf.f,tf.p):null;
 const po=sel=>ps.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)} (${esc(p.sku)})</option>`).join('');
 const lo=sel=>[['main','Warehouse'],...bs.map(b=>[b.id,b.name])].map(([v,n])=>`<option value="${v}" ${sel===v?'selected':''}>${esc(n)}</option>`).join('');
 return `<div class="card"><h3>Receive stock into the warehouse</h3><form class="fm row" data-s="receive"><label>Product<select name="p" required><option value="">Select…</option>${po('')}</select></label><label>Quantity received<input name="q" type="number" min="1" step="1" required></label><label>Supplier / invoice no.<input name="n"></label><button class="p">Receive stock</button></form></div>
<div class="card"><h3>Transfer stock</h3><p class="mu sm">The sending place goes down and the receiving place goes up at the same time. Warehouse → Branch distributes stock. Branch → Warehouse returns it. Branch → Branch also works.</p>
<form class="fm row" data-s="transfer"><label>Product<select name="p" data-c="tf" data-id="p" required><option value="">Select…</option>${po(tf.p)}</select></label><label>From<select name="fr" data-c="tf" data-id="f">${lo(tf.f)}</select></label><label>To<select name="to" data-c="tf" data-id="t" required><option value="">Select…</option>${lo(tf.t)}</select></label><label>Quantity${av!==null?' (available '+av+')':''}<input id="tfq" name="q" type="number" min="1" step="1" value="${esc(tf.q)}" required></label><label>Note<input id="tfn" name="n" value="${esc(tf.n)}"></label><button class="p">Transfer</button></form></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h3>Stock across all locations</h3><span style="display:flex;gap:8px;flex-wrap:wrap"><button data-a="pick" data-id="stk">Import counts</button><button data-a="xwh">Export</button></span><input type="file" accept=".csv,text/csv" id="f_stk" data-f="stk" hidden></div><div class="tw"><table><tr><th>Product</th><th>SKU</th><th>Warehouse</th>${bs.map(b=>`<th>${esc(b.name)}</th>`).join('')}<th>Total</th><th></th></tr>
${ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td><b>${ast('main',p.id)}</b></td>${bs.map(b=>`<td>${ast(b.id,p.id)}</td>`).join('')}<td>${ast('main',p.id)+bs.reduce((a,b)=>a+ast(b.id,p.id),0)}</td><td><button data-a="adjust" data-id="${p.id}">Adjust warehouse</button></td></tr>`).join('')||'<tr><td colspan="9" class="mu">Add products first.</td></tr>'}</table></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h3>Movement history</h3><button data-a="xmoves">Export</button></div><div class="tw"><table><tr><th>Date</th><th>Type</th><th>Product</th><th class="r">Qty</th><th>From</th><th>To</th><th>By</th><th>Note</th></tr>
${st.moves.map(m=>`<tr><td>${fdt(m.ts)}</td><td><span class="tag retail">${MT[m.type]||m.type}</span></td><td>${esc(m.name)}</td><td class="r">${m.type==='adjust'&&m.qty>0?'+':''}${m.qty}</td><td>${esc(loc(m.from))}</td><td>${esc(loc(m.to))}</td><td>${esc(m.uname)}</td><td>${esc(m.note)}</td></tr>`).join('')||'<tr><td colspan="8" class="mu">No movements yet.</td></tr>'}</table></div></div>`}
function render(){const a=$('app');document.title=appName();if(!auth)return;
 if(st.me===undefined){a.innerHTML='<p class="mu" style="padding:24px">Loading…</p>';return}
 if(!st.me){a.innerHTML=authV();$('m').innerHTML='';return}
 if(!(st.me.role&&st.me.active!==false&&(isAdmin()||st.me.branch))){a.innerHTML=waitV();return}
 if(!tabs().some(t=>t[0]===st.tab))st.tab='pos';
 const hdr=`<header><b>${logo(26)}${esc(appName())}</b>${isAdmin()?`<select data-c="view" aria-label="Branch">${st.branches.map(b=>`<option value="${b.id}" ${st.view===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}${st.tab==='sales'?`<option value="all" ${st.view==='all'?'selected':''}>All branches</option>`:''}</select>`:`<span>${esc(bname(st.me.branch))}</span>`}${net()}<span class="sm mu">${esc(st.me.name)} · ${st.me.role}</span><button data-a="myphone">My contact</button><button data-a="out">Log out</button></header>
<nav>${tabs().map(t=>`<button class="${st.tab===t[0]?'on':''}" data-a="tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</nav>`;
 const f=document.activeElement,keep=f&&f.id==='qs';
 a.innerHTML=hdr+'<main>'+({pos:posV,sales:salesV,products:prodV,warehouse:whV,branches:branchV,users:usersV}[st.tab])()+'</main><p class="sm mu" style="text-align:center;padding:10px">Build '+BUILD+'</p>';
 $('m').innerHTML=st.rc?rcptV(st.rc):st.rf?rfV(st.rf):'';
 if(keep){const i=$('qs');i.focus();i.setSelectionRange(st.q.length,st.q.length)}}

/* ---------- actions ---------- */
const A={
 clr:()=>{st.from=st.to='';render()},
 pick:id=>$('f_'+id).click(),
 xwh:()=>dl('stock-all-locations',[['Product','SKU','Warehouse',...st.branches.map(b=>b.name),'Total'],...st.products.map(p=>[p.name,p.sku,ast('main',p.id),...st.branches.map(b=>ast(b.id,p.id)),ast('main',p.id)+st.branches.reduce((a,b)=>a+ast(b.id,p.id),0)])]),
 xmoves:()=>dl('stock-movements',[['Date','Type','Product','SKU','Qty','From','To','By','Note'],...st.moves.map(m=>[fdt(m.ts),MT[m.type]||m.type,m.name,m.sku,m.qty,loc(m.from),loc(m.to),m.uname,m.note])]),
 async adjust(id){const p=prod(id),c0=ast('main',id),v=prompt('Counted quantity in the warehouse for '+p.name,c0);if(v===null)return;const n=parseInt(v);
  if(!(n>=0))return toast('Enter 0 or more.');if(n===c0)return;
  try{const b=writeBatch(db);b.set(doc(db,'stock','main_'+id),{branch:'main',product:id,qty:n},{merge:true});mv(b,'adjust',p,n-c0,'main','main','Stock count correction');await b.commit();toast('Warehouse count updated.')}catch(e){toast(e.message)}},
 async delsale(id){const s=st.sales.find(x=>x.id===id);if(!s||!isAdmin())return;
  if(!confirm(`Delete sale ${s.no} (${cur(s.total)})? Any refunds on it are removed too. This cannot be undone.`))return;
  const rs=st.refunds.filter(r=>r.sale===id),back=confirm('Return the items from this sale to stock?\n\nOK = return to stock\nCancel = leave stock as it is');
  try{const batch=writeBatch(db);batch.delete(doc(db,'sales',id));rs.forEach(r=>batch.delete(doc(db,'refunds',r.id)));
   if(back)s.items.forEach(i=>{const n=i.qty-rs.filter(r=>r.restock).reduce((a,r)=>a+(r.items.find(x=>x.id===i.id)?.qty||0),0);if(n>0)batch.set(doc(db,'stock',s.branch+'_'+i.id),{branch:s.branch,product:i.id,qty:increment(n)},{merge:true})});
   await batch.commit();toast('Sale deleted.')}catch(e){toast('Delete failed: '+e.message)}},
 xusers:()=>dl('staff-contacts',[['Name','Phone','Email','Role','Branch','Status'],...st.users.map(u=>[u.name,u.phone,u.email,u.role||'Unassigned',bname(u.branch),u.active===false?'Disabled':'Active'])]),
 ephone:async id=>{const u=st.users.find(x=>x.id===id),v=prompt('Phone number for '+u.name,u.phone||'');if(v!==null)try{await updateDoc(doc(db,'users',id),{phone:v.trim()});toast('Phone saved.')}catch(e){toast(e.message)}},
 myphone:async()=>{const v=prompt('Your phone number',st.me.phone||'');if(v!==null&&v.trim())try{await updateDoc(doc(db,'users',st.uid),{phone:v.trim()});toast('Contact saved.')}catch(e){toast(e.message)}},
 xsales:()=>dl('sales_'+bn(),[['Receipt','Date','Branch','Cashier','Type','Customer','Payment','Items sold','Total','Status'],...fsales().map(s=>[s.no,fdt(s.ts),bname(s.branch),s.uname,s.mode,s.customer,s.pay,s.items.reduce((a,i)=>a+i.qty,0),s.total.toFixed(2),stat(s)||'Completed'])]),
 xitems:()=>dl('sale-items_'+bn(),[['Receipt','Date','Branch','Cashier','Type','Product','Qty','Unit price','Line total'],...fsales().flatMap(s=>s.items.map(i=>[s.no,fdt(s.ts),bname(s.branch),s.uname,s.mode,i.name,i.qty,i.price.toFixed(2),(i.qty*i.price).toFixed(2)]))]),
 xrefunds:()=>dl('refunds_'+bn(),[['Refund no.','Date','Original sale','Branch','Processed by','Reason','Returned to stock','Amount'],...frefs().map(r=>[r.no,fdt(r.ts),r.saleNo,bname(r.branch),r.uname,r.reason,r.restock?'Yes':'No',r.total.toFixed(2)])]),
 xstock:()=>{const b=brId();if(!b||b==='all')return toast('Select a branch first.');dl('inventory_'+bname(b).replace(/\W+/g,'-'),[['Product','SKU','Retail price','Retail min price','Wholesale price','Wholesale min price','Quantity','Stock value (retail)'],...st.products.map(p=>[p.name,p.sku,p.rp,p.rmp??p.rp,p.wp,p.wmp??p.wp,stock(p.id),(stock(p.id)*p.rp).toFixed(2)])])},
 am:id=>{st.am=id;render()},out:()=>signOut(auth),print:()=>window.print(),
 reset:async()=>{const e=prompt('Enter your account email');if(e)try{await sendPasswordResetEmail(auth,e);toast('Password reset email sent.')}catch(x){toast(x.message)}},
 tab:id=>{st.tab=id;if(st.view==='all'&&id!=='sales'){st.view=st.branches[0]?.id;watchBranch()}render()},
 mode:id=>{st.mode=id;st.cart.forEach(c=>delete c.price);render()},
 add:id=>{const c=st.cart.find(x=>x.id===id);c?c.qty++:st.cart.push({id,qty:1});render()},
 rm:id=>{st.cart=st.cart.filter(x=>x.id!==id);render()},
 edit:id=>{st.ed=id||null;render();scrollTo(0,0)},
 rcpt:id=>{st.rc=st.sales.find(s=>s.id===id);render()},
 closerc:(id,t,e)=>{if(e.target===t||id==='x'){st.rc=null;st.rf=null;render()}},
 rfopen:id=>{st.rf=st.sales.find(s=>s.id===id);render()},
 rrcpt:id=>{st.rc={...st.refunds.find(r=>r.id===id),refund:true};render()},
 delp:async id=>{if(confirm('Delete this product?'))try{await deleteDoc(doc(db,'products',id))}catch(e){toast(e.message)}},
 renb:async id=>{const n=prompt('Branch name',bname(id));if(n?.trim())try{await updateDoc(doc(db,'branches',id),{name:n.trim()})}catch(e){toast(e.message)}},
 delb:async id=>{if(st.users.some(u=>u.branch===id))return toast('Reassign this branch\'s staff first.');if(confirm('Delete this branch?'))try{await deleteDoc(doc(db,'branches',id))}catch(e){toast(e.message)}},
 async checkout(){const b=brId(),m=st.mode,cu=($('cu')?.value||'').trim();
  if(!st.cart.length)return toast('Cart is empty.');
  for(const c of st.cart){const p=prod(c.id);if(c.qty<1)return toast(`${p.name}: quantity must be at least 1.`);if(c.qty>stock(p.id))return toast(`${p.name}: only ${stock(p.id)} in stock.`);if(up(c)<minp(p))return toast(`${p.name}: lowest ${m} price is ${cur(minp(p))}.`)}
  if(m==='wholesale'&&!cu)return toast('Enter the wholesale customer name.');
  const items=st.cart.map(c=>({id:c.id,name:prod(c.id).name,qty:c.qty,price:up(c)})),tend=+$('tend').value||0;
  const s={no:'R'+Date.now().toString(36).toUpperCase().slice(-7),branch:b,uid:st.uid,uname:st.me.name,mode:m,customer:cu,pay:$('pay').value,tend,items,total:total()};
  try{const batch=writeBatch(db);batch.set(doc(collection(db,'sales')),{...s,ts:new Date()});
   items.forEach(i=>batch.set(doc(db,'stock',b+'_'+i.id),{branch:b,product:i.id,qty:increment(-i.qty)},{merge:true}));
   await batch.commit();st.cart=[];st.rc={...s,ts:Date.now()};render()}catch(e){toast('Sale failed: '+e.message)}}};
const C={
 tf:(id,v)=>{st.tf.q=$('tfq')?.value||'';st.tf.n=$('tfn')?.value||'';st.tf[id]=v;render()},
 from:(_,v)=>{st.from=v;render()},to:(_,v)=>{st.to=v;render()},
 uprice:(id,v)=>{st.cart.find(x=>x.id===id).price=Math.max(0,+v||0);render()},
 qty:(id,v)=>{st.cart.find(x=>x.id===id).qty=Math.max(0,parseInt(v)||0);render()},
 view:(_,v)=>{st.view=v;watchBranch();render()},
 stock:async(id,v)=>{const b=brId();try{await setDoc(doc(db,'stock',b+'_'+id),{branch:b,product:id,qty:Math.max(0,parseInt(v)||0)},{merge:true});toast('Stock updated.')}catch(e){toast(e.message)}},
 role:(id,v)=>upd(id,{role:v||null,...(v==='admin'?{branch:null}:{})}),ubranch:(id,v)=>upd(id,{branch:v||null}),active:(id,v)=>upd(id,{active:v==='1'})};
const upd=async(id,d)=>{try{await updateDoc(doc(db,'users',id),d)}catch(e){toast(e.message)}};
const F={
 async auth(f){const d=Object.fromEntries(new FormData(f));try{

 async refund(f){const s=st.rf,d=new FormData(f),b=s.branch;
  const items=s.items.map(i=>({id:i.id,name:i.name,price:i.price,qty:parseInt(d.get('q_'+i.id))||0})).filter(i=>i.qty>0);

   if(r.restock)items.forEach(i=>batch.set(doc(db,'stock',b+'_'+i.id),{branch:b,product:i.id,qty:increment(i.qty)},{merge:true}));

 async receive(f){const d=Object.fromEntries(new FormData(f)),p=prod(d.p),q=parseInt(d.q);
  if(!p||!(q>0))return toast('Choose a product and a quantity above 0.');

 async transfer(f){const d=Object.fromEntries(new FormData(f)),p=prod(d.p),q=parseInt(d.q),fr=d.fr,to=d.to;
  if(!p||!(q>0)||!to)return toast('Choose a product, a destination and a quantity above 0.');
  if(fr===to)return toast('From and To must be different.');
  const have=ast(fr,p.id);if(q>have)return toast(`Only ${have} of ${p.name} at ${loc(fr)}.`);
  try{const b=writeBatch(db);b.set(doc(db,'stock',fr+'_'+p.id),{branch:fr,product:p.id,qty:increment(-q)},{merge:true});b.set(doc(db,'stock',to+'_'+p.id),{branch:to,product:p.id,qty:increment(q)},{merge:true});
   mv(b,fr==='main'?'distribute':to==='main'?'return':'transfer',p,q,fr,to,d.n.trim());await b.commit();st.tf.q='';st.tf.n='';toast(`${q} × ${p.name}: ${loc(fr)} → ${loc(to)}.`)}catch(e){toast(e.message)}},

/* ---------- CSV import (files made by this app's Export buttons) ---------- */
const parseCSV=t=>{t=t.replace(/^\ufeff/,'');const rows=[];let r=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===','){r.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[]}else f+=c}
 if(f!==''||r.length){r.push(f);rows.push(r)}return rows.filter(r=>r.some(x=>x.trim()!==''))};
const hmap=h=>Object.fromEntries(h.map((x,i)=>[x.trim().toLowerCase(),i]));
const I={
 async inv(file,el){if(!file)return;const rows=parseCSV(await file.text());el.value='';if(rows.length<2)return toast('The file is empty.');
  const H=hmap(rows[0]);
  if(['product','sku','retail price','wholesale price'].some(k=>H[k]===undefined))return toast(H.receipt!==undefined||H['refund no.']!==undefined?'Sales, refunds and staff exports are reports for reading and cannot be imported.':'This is not an inventory export. Use Products & stock → Export inventory.');
  const b=brId(),qb=H.quantity!==undefined&&b&&b!=='all',num=(r,k,d)=>{const v=H[k]===undefined?'':(r[H[k]]||'').trim();return v===''?d:+v};
  const items=new Map(),bad=[];
  rows.slice(1).forEach((r,i)=>{const name=(r[H.product]||'').trim(),sku=(r[H.sku]||'').trim(),rp=num(r,'retail price',NaN),wp=num(r,'wholesale price',NaN);
   if(!name||!sku||!(rp>=0)||!(wp>=0))return bad.push(i+2);
   const q=H.quantity===undefined?null:num(r,'quantity',NaN);
   items.set(sku.toLowerCase(),{name,sku,rp,rmp:Math.min(num(r,'retail min price',rp),rp),wp,wmp:Math.min(num(r,'wholesale min price',wp),wp),q:Number.isFinite(q)&&q>=0?Math.floor(q):null})});
  if(!items.size)return toast('No valid rows found.'+(bad.length?' Check row(s) '+bad.slice(0,5).join(', ')+'.':''));
  const ex=new Map(st.products.map(p=>[String(p.sku).toLowerCase(),p])),list=[...items.entries()],nw=list.filter(([k])=>!ex.has(k)).length;
  if(!confirm(`Import ${list.length} products: ${nw} new, ${list.length-nw} to update.\n`+(qb?`Quantities will be set at ${bname(b)}.`:'Quantities will not be changed (pick a single branch in the header to import them).')+(bad.length?`\n${bad.length} invalid row(s) will be skipped.`:'')+'\n\nContinue?'))return;
  try{for(let i=0;i<list.length;i+=200){const bt=writeBatch(db);
    list.slice(i,i+200).forEach(([k,v])=>{const old=ex.get(k),ref=old?doc(db,'products',old.id):doc(collection(db,'products')),{q,...d}=v;bt.set(ref,d);if(qb&&q!==null)bt.set(doc(db,'stock',b+'_'+ref.id),{branch:b,product:ref.id,qty:q},{merge:true})});
    await bt.commit()}
   toast(`Imported ${list.length} products.`+(bad.length?` Skipped ${bad.length} invalid row(s).`:''))}catch(e){toast('Import failed: '+e.message)}},
 async stk(file,el){if(!file)return;const rows=parseCSV(await file.text());el.value='';const H=hmap(rows[0]||[]);
  if(H.sku===undefined||H.warehouse===undefined)return toast('This is not a stock export. Use Stock across all locations → Export.');
  const cols=[['main',H.warehouse],...st.branches.filter(b=>H[b.name.trim().toLowerCase()]!==undefined).map(b=>[b.id,H[b.name.trim().toLowerCase()]])];
  const ex=new Map(st.products.map(p=>[String(p.sku).toLowerCase(),p])),ops=[];let miss=0;
  rows.slice(1).forEach(r=>{const p=ex.get((r[H.sku]||'').trim().toLowerCase());if(!p)return miss++;
   cols.forEach(([l,ci])=>{const v=(r[ci]||'').trim();if(v==='')return;const n=Math.floor(+v);if(!(n>=0)||n===ast(l,p.id))return;ops.push([p,l,n])})});
  if(!ops.length)return toast('Nothing to change: the counts already match'+(miss?`. ${miss} unknown SKU(s) skipped.`:'.'));
  if(!confirm(`Update ${ops.length} stock count(s) across ${cols.length} location(s)?`+(miss?`\n${miss} row(s) with unknown SKUs will be skipped.`:'')+'\nEach change is logged as an adjustment.\n\nContinue?'))return;
  try{for(let i=0;i<ops.length;i+=200){const bt=writeBatch(db);
    ops.slice(i,i+200).forEach(([p,l,n])=>{bt.set(doc(db,'stock',l+'_'+p.id),{branch:l,product:p.id,qty:n},{merge:true});mv(bt,'adjust',p,n-ast(l,p.id),l,l,'Imported from file')});
    await bt.commit()}
   toast(`Updated ${ops.length} stock count(s).`)}catch(e){toast('Import failed: '+e.message)}}};
