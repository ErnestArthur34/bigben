<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tillwise POS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4e89'/%3E%3Cpath d='M18 12h28v40l-5-4-4 4-5-4-5 4-4-4-5 4z' fill='white'/%3E%3Cpath d='M24 22h16M24 30h16M24 38h10' stroke='%231d4e89' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#1d4e89">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--card:#fff;--tx:#17212b;--mu:#667085;--bd:#dedad2;--ac:#1d4e89;--on:#fff;--w:#b45309;--wbg:#fdf0dc;--rbg:#e3edf9;--dg:#b42318;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mu:#93a0b1;--bd:#2d3744;--ac:#6fa8ee;--on:#0b1620;--w:#f0b35c;--wbg:#3a2c14;--rbg:#1b2d44;--dg:#f97066;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'IBM Plex Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0 0 .5rem}
.mu{color:var(--mu)}.r{text-align:right}.sm{font-size:13px}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
header b{font:700 18px 'Bricolage Grotesque',sans-serif;margin-right:auto;display:flex;align-items:center;gap:8px}
nav{display:flex;gap:4px;padding:8px 16px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}nav button{white-space:nowrap}
main{padding:16px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
button,select,input{font:inherit;color:var(--tx)}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;min-width:0}
button{background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
button.d{color:var(--dg)}:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.auth{max-width:380px;margin:8vh auto}.fm{display:grid;gap:10px}
.seg{display:flex;gap:6px;margin:10px 0}.seg button{flex:1}
.pos{display:grid;grid-template-columns:1fr 360px;gap:16px}@media(max-width:820px){.pos{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.prod{text-align:left;display:grid;gap:2px;padding:10px}.prod:disabled{opacity:.45;cursor:not-allowed}
.mode{display:flex;gap:6px}.mode button{flex:1;font-weight:600}.mode .wh.on{background:var(--w);border-color:var(--w);color:#fff}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.tag.refunded{background:var(--wbg);color:var(--dg)}.tag.retail{background:var(--rbg);color:var(--ac)}.tag.wholesale{background:var(--wbg);color:var(--w)}
.line{display:grid;grid-template-columns:1fr 64px 70px 24px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.line input{width:64px;padding:5px}.line .bad{border-color:var(--dg)}
.tot{font:700 24px 'Bricolage Grotesque',sans-serif}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.fm.row{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));align-items:end}.fm label{display:grid;gap:3px;font-size:13px;color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}.stats b{display:block;font:700 22px 'Bricolage Grotesque',sans-serif}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:16px;z-index:20}
.rc{max-width:340px;width:100%;max-height:90vh;overflow:auto;font:13px/1.4 ui-monospace,Menlo,monospace}
.rc .rw{display:flex;justify-content:space-between;gap:8px}.rc hr{border:0;border-top:1px dashed var(--mu)}.ctr{text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;max-width:90vw}
@page{size:80mm auto;margin:3mm}
@media print{body>*:not(#m){display:none!important}.modal{position:static;background:none;padding:0;display:block}.rc{max-width:none;border:0;background:#fff;color:#000;max-height:none;overflow:visible}.noprint{display:none!important}}
</style></head><body>
<div id="app"></div><div id="m"></div><div id="t"></div>
<script type="module">
/* ====== Firebase web config (project: bigben-40433) ====== */
const firebaseConfig={
  apiKey:"AIzaSyBOawwWbPjS_zust1P7hHZcJef05ITO-AM",
  authDomain:"bigben-40433.firebaseapp.com",
  projectId:"bigben-40433",
  storageBucket:"bigben-40433.firebasestorage.app",
  messagingSenderId:"355854786705",
  appId:"1:355854786705:web:f864a01c34c219bca45f30"
};
/* ========================================================================================= */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,where,writeBatch,increment,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{$('t').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>$('t').innerHTML='',3500)};
const st={uid:null,me:undefined,branches:[],products:[],stock:{},sales:[],refunds:[],rf:null,users:[],cfg:{},view:null,tab:'pos',mode:'retail',cart:[],q:'',am:'in',rc:null,ed:null};
const cur=n=>(st.cfg.cur||'')+(+n||0).toFixed(2);
const bname=id=>st.branches.find(b=>b.id===id)?.name||'—',uname=id=>st.users.find(u=>u.id===id)?.name||'—';
const prod=id=>st.products.find(p=>p.id===id),stock=id=>st.stock[id]||0;
const isAdmin=()=>st.me?.role==='admin',brId=()=>isAdmin()?st.view:st.me.branch;
const price=p=>st.mode==='retail'?p.rp:p.wp;
const up=c=>c.price??price(prod(c.id)),minp=p=>st.mode==='retail'?(p.rmp??p.rp):(p.wmp??p.wp);
const ms=t=>t?.toMillis?t.toMillis():(t||Date.now());
const appName=()=>st.cfg.app||'Tillwise POS';
const logo=n=>`<svg width="${n}" height="${n}" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--ac)"/><path d="M18 12h28v40l-5-4-4 4-5-4-5 4-4-4-5 4z" fill="var(--on)"/><path d="M24 22h16M24 30h16M24 38h10" stroke="var(--ac)" stroke-width="3" stroke-linecap="round"/></svg>`;
const refd=(sid,pid)=>st.refunds.filter(r=>r.sale===sid).reduce((a,r)=>a+(r.items.find(i=>i.id===pid)?.qty||0),0);
const stat=s=>{const l=s.items.map(i=>i.qty-refd(s.id,i.id));return l.every(x=>x<=0)?'Refunded':l.some((x,k)=>x<s.items[k].qty)?'Partial refund':''};

let auth,db,subs=[],bsubs=[],pub=null;
try{if(firebaseConfig.apiKey.startsWith('YOUR'))throw 0;const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);onSnapshot(doc(db,'settings','shop'),s=>{st.cfg=s.data()||{};render()},()=>{})}catch(e){document.getElementById('app').innerHTML='<div class="card auth"><h2>Firebase is not configured</h2><p class="mu">Open index.html and paste your Firebase web config into <code>firebaseConfig</code>.</p></div>'}
/* Firebase rejects passwords under 6 characters, so short ones are padded with a fixed suffix before being sent. Passwords of 6+ characters are sent unchanged. */
const fp=p=>p.length<6?p+'#pos-pad':p;
const clear=a=>{a.forEach(u=>u());a.length=0};

if(auth)onAuthStateChanged(auth,u=>{clear(subs);clear(bsubs);pub&&pub();st.uid=u?.uid||null;st.me=undefined;
 if(!u){st.me=null;return render()}
 pub=onSnapshot(doc(db,'users',u.uid),s=>{const was=st.me&&st.me.role&&st.me.active,ob=st.me?.branch;st.me=s.exists()?{id:s.id,...s.data()}:{id:u.uid,role:null};
  const ok=st.me.role&&st.me.active!==false&&(st.me.role==='admin'||st.me.branch);
  if(ok&&!was){start()}else if(ok&&ob!==st.me.branch){watchBranch()}else if(!ok){clear(subs);clear(bsubs)}render()},e=>toast(e.message))});

const list=(q,key)=>onSnapshot(q,s=>{st[key]=s.docs.map(d=>({id:d.id,...d.data()}));if(key==='branches'&&isAdmin()&&!st.branches.some(b=>b.id===st.view)&&st.view!=='all'){st.view=st.branches[0]?.id||null;watchBranch()}render()},e=>toast(e.message));
function start(){
 subs.push(list(collection(db,'branches'),'branches'),list(collection(db,'products'),'products'));
 if(isAdmin())subs.push(list(collection(db,'users'),'users'));
 watchBranch()}
function watchBranch(){clear(bsubs);const b=brId();if(!st.me?.role)return;
 if(b&&b!=='all')bsubs.push(onSnapshot(query(collection(db,'stock'),where('branch','==',b)),s=>{st.stock={};s.docs.forEach(d=>st.stock[d.data().product]=d.data().qty);render()},e=>toast(e.message)));
 const sq=b==='all'?collection(db,'sales'):st.me.role==='cashier'?query(collection(db,'sales'),where('branch','==',b),where('uid','==',st.uid)):query(collection(db,'sales'),where('branch','==',b));
 st.refunds=[];if(b&&st.me.role!=='cashier')bsubs.push(onSnapshot(b==='all'?collection(db,'refunds'):query(collection(db,'refunds'),where('branch','==',b)),s=>{st.refunds=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,c)=>ms(c.ts)-ms(a.ts));render()},e=>toast(e.message)));
 if(b)bsubs.push(onSnapshot(sq,s=>{st.sales=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,c)=>ms(c.ts)-ms(a.ts));render()},e=>toast(e.message)))}

/* ---------- views ---------- */
const authV=()=>`<div class="card auth"><h1 style="display:flex;align-items:center;gap:10px">${logo(36)}${esc(appName())}</h1><p class="mu">Log in with your staff account. New accounts wait for an admin to assign a role and branch.</p>
<div class="seg"><button class="${st.am==='in'?'on':''}" data-a="am" data-id="in">Log in</button><button class="${st.am==='up'?'on':''}" data-a="am" data-id="up">Create account</button></div>
<form class="fm" data-s="auth">${st.am==='up'?'<input name="n" placeholder="Full name" required>':''}<input name="e" type="email" placeholder="Email" required><input name="p" type="password" placeholder="Password (any length)" required><button class="p">${st.am==='up'?'Create account':'Log in'}</button></form>
${st.am==='in'?'<p class="sm"><a href="#" data-a="reset">Forgot password?</a></p>':''}</div>`;
const waitV=()=>{const m=st.me;return `<div class="card auth"><h2>${m.active===false?'Account disabled':'Waiting for access'}</h2><p class="mu">${m.active===false?'An admin has disabled this account.':m.role?'An admin still needs to assign you to a branch.':'An admin needs to assign your role and branch. Ask them, then refresh.'}</p><button data-a="out">Log out</button></div>`};
const tabs=()=>[['pos','Point of sale'],['sales','Sales'],...(st.me.role!=='cashier'?[['products','Products & stock']]:[]),...(isAdmin()?[['branches','Branches & shop'],['users','Users']]:[])];

const gridV=()=>{const ps=st.products.filter(p=>(p.name+p.sku).toLowerCase().includes(st.q.toLowerCase()));
 return ps.map(p=>`<button class="prod" ${stock(p.id)<1?'disabled':''} data-a="add" data-id="${p.id}"><b>${esc(p.name)}</b><span class="mu sm">${esc(p.sku)}</span><span>${cur(price(p))}</span><span class="sm mu">Lowest ${cur(minp(p))} · ${stock(p.id)} in stock</span></button>`).join('')||'<p class="mu">No products yet. Add some under Products & stock.</p>'};
const total=()=>st.cart.reduce((s,c)=>s+up(c)*c.qty,0);
function posV(){if(!brId()||brId()==='all')return '<div class="card">Select a branch in the header to start selling.</div>';
 st.cart=st.cart.filter(c=>prod(c.id));const m=st.mode;
 return `<div class="pos"><div><div class="mode"><button class="${m==='retail'?'on':''}" data-a="mode" data-id="retail">Retail</button><button class="wh ${m==='wholesale'?'on':''}" data-a="mode" data-id="wholesale">Wholesale</button></div>
<input id="qs" style="width:100%;margin-top:10px" placeholder="Search name or SKU" value="${esc(st.q)}" data-i="q"><div class="grid" id="gr">${gridV()}</div></div>
<div class="card" style="align-self:start"><h3>Cart <span class="tag ${m}">${m}</span></h3>
${st.cart.map(c=>{const p=prod(c.id),bad=c.qty<1||c.qty>stock(p.id),pb=up(c)<minp(p);return `<div class="line"><div>${esc(p.name)}<div class="sm mu">Lowest price ${cur(minp(p))} · ${stock(p.id)} in stock</div><input type="number" step="0.01" min="0" class="${pb?'bad':''}" style="width:96px;padding:4px 6px;margin-top:3px" value="${up(c)}" data-c="uprice" data-id="${c.id}" aria-label="Unit price"></div><input type="number" min="0" class="${bad?'bad':''}" value="${c.qty}" data-c="qty" data-id="${c.id}"><span class="r">${cur(up(c)*c.qty)}</span><button class="d" style="padding:2px 6px" data-a="rm" data-id="${c.id}" aria-label="Remove">✕</button></div>`}).join('')||'<p class="mu">Tap a product to add it.</p>'}
${m==='wholesale'?'<input id="cu" style="width:100%;margin-top:10px" placeholder="Customer / business name">':''}
<select id="pay" style="width:100%;margin-top:10px"><option>Cash</option><option>Card</option><option>Mobile money</option><option>Credit</option></select>
<input id="tend" type="number" step="0.01" min="0" style="width:100%;margin-top:10px" placeholder="Amount received (optional, shows change)">
<div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0"><span>Total</span><span class="tot">${cur(total())}</span></div>
<button class="p" style="width:100%" data-a="checkout">Complete sale</button></div></div>`}

function prodV(){const b=brId(),e=st.ed?prod(st.ed)||{}:{},ok=b&&b!=='all';
 return `<div class="card"><h3>${e.id?'Edit product':'New product'}</h3><form class="fm row" data-s="prod"><input type="hidden" name="id" value="${e.id||''}">
<label>Name<input name="name" value="${esc(e.name)}" required></label><label>SKU<input name="sku" value="${esc(e.sku)}" required></label>
<label>Retail price<input name="rp" type="number" step="0.01" min="0" value="${e.rp??''}" required></label><label>Retail minimum price<input name="rmp" type="number" step="0.01" min="0" value="${e.rmp??''}" placeholder="same as price"></label>
<label>Wholesale price<input name="wp" type="number" step="0.01" min="0" value="${e.wp??''}" required></label><label>Wholesale minimum price<input name="wmp" type="number" step="0.01" min="0" value="${e.wmp??''}" placeholder="same as price"></label><label>Quantity${ok?' at '+esc(bname(b)):' (pick a branch)'}<input name="qty" type="number" min="0" step="1" value="${e.id?stock(e.id):0}" ${ok?'required':'disabled'}></label>
<button class="p">Save product</button>${e.id?'<button type="button" data-a="edit" data-id="">Cancel</button>':''}</form></div>
<div class="card"><h3>Catalogue${b&&b!=='all'?' · stock at '+esc(bname(b)):''}</h3><div class="tw"><table><tr><th>Name</th><th>SKU</th><th>Retail</th><th>Min price</th><th>Wholesale</th><th>Min price</th><th>Quantity</th><th></th></tr>
${st.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td>${cur(p.rp)}</td><td>${cur(p.rmp??p.rp)}</td><td>${cur(p.wp)}</td><td>${cur(p.wmp??p.wp)}</td><td>${b&&b!=='all'?`<input type="number" min="0" style="width:80px" value="${stock(p.id)}" data-c="stock" data-id="${p.id}">`:'—'}</td><td><button data-a="edit" data-id="${p.id}">Edit</button> ${isAdmin()?`<button class="d" data-a="delp" data-id="${p.id}">Delete</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8" class="mu">No products yet.</td></tr>'}</table></div></div>`}

function salesV(){const ls=st.sales,rt=st.refunds.reduce((a,r)=>a+r.total,0),sum=m=>ls.filter(s=>s.mode===m).reduce((a,s)=>a+s.total,0);
 return `<div class="stats"><div>Sales<b>${ls.length}</b></div><div>Retail<b>${cur(sum('retail'))}</b></div><div>Wholesale<b>${cur(sum('wholesale'))}</b></div>${st.me.role!=='cashier'?`<div>Refunds<b>${cur(rt)}</b></div>`:''}<div>Net sales<b>${cur(sum('retail')+sum('wholesale')-rt)}</b></div></div>
<div class="card"><h3>Sales history</h3><div class="tw"><table><tr><th>Receipt</th><th>Date</th><th>Branch</th><th>Cashier</th><th>Type</th><th>Customer</th><th class="r">Total</th><th>Status</th><th></th></tr>
${ls.map(s=>`<tr><td>${s.no}</td><td>${new Date(ms(s.ts)).toLocaleString()}</td><td>${esc(bname(s.branch))}</td><td>${esc(s.uname)}</td><td><span class="tag ${s.mode}">${s.mode}</span></td><td>${esc(s.customer)||'—'}</td><td class="r">${cur(s.total)}</td><td>${stat(s)?`<span class="tag refunded">${stat(s)}</span>`:''}</td><td><button data-a="rcpt" data-id="${s.id}">Reprint</button>${st.me.role!=='cashier'&&stat(s)!=='Refunded'?` <button class="d" data-a="rfopen" data-id="${s.id}">Refund</button>`:''}</td></tr>`).join('')||'<tr><td colspan="9" class="mu">No sales yet.</td></tr>'}</table></div></div>
${st.me.role!=='cashier'?`<div class="card"><h3>Refunds</h3><div class="tw"><table><tr><th>Refund</th><th>Date</th><th>Sale</th><th>By</th><th>Reason</th><th class="r">Amount</th><th></th></tr>${st.refunds.map(r=>`<tr><td>${r.no}</td><td>${new Date(ms(r.ts)).toLocaleString()}</td><td>${r.saleNo}</td><td>${esc(r.uname)}</td><td>${esc(r.reason)}</td><td class="r">-${cur(r.total)}</td><td><button data-a="rrcpt" data-id="${r.id}">Reprint</button></td></tr>`).join('')||'<tr><td colspan="7" class="mu">No refunds yet.</td></tr>'}</table></div></div>`:''}`}

const branchV=()=>{const c=st.cfg;return `<div class="card"><h3>App name, shop & receipt details</h3><form class="fm row" data-s="cfg"><label>App name<input name="app" value="${esc(c.app)}" placeholder="Tillwise POS"></label><label>Shop name<input name="name" value="${esc(c.name)}"></label><label>Address<input name="addr" value="${esc(c.addr)}"></label><label>Phone<input name="tel" value="${esc(c.tel)}"></label><label>Currency symbol<input name="cur" value="${esc(c.cur)}" maxlength="4"></label><label>Receipt footer<input name="foot" value="${esc(c.foot??'Thank you for shopping with us!')}"></label><button class="p">Save</button></form></div>
<div class="card"><h3>Branches</h3><form class="fm row" data-s="branch"><label>New branch name<input name="n" required></label><button class="p">Add branch</button></form>
<div class="tw"><table><tr><th>Branch</th><th>Staff</th><th></th></tr>${st.branches.map(b=>`<tr><td>${esc(b.name)}</td><td>${st.users.filter(u=>u.branch===b.id).length}</td><td><button data-a="renb" data-id="${b.id}">Rename</button> <button class="d" data-a="delb" data-id="${b.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="3" class="mu">Add your first branch.</td></tr>'}</table></div></div>`};
const usersV=()=>`<div class="card"><h3>Users & roles</h3><p class="mu sm">Admins see every branch. Managers and cashiers work in one assigned branch. Managers edit products and stock; cashiers sell and see their own sales.</p><div class="tw"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Branch</th><th>Status</th></tr>
${st.users.map(u=>{const self=u.id===st.uid;return `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><select ${self?'disabled':''} data-c="role" data-id="${u.id}"><option value="">Unassigned</option>${['admin','manager','cashier'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></td>
<td><select ${u.role==='admin'?'disabled':''} data-c="ubranch" data-id="${u.id}"><option value="">None</option>${st.branches.map(b=>`<option value="${b.id}" ${u.branch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></td>
<td><select ${self?'disabled':''} data-c="active" data-id="${u.id}"><option value="1" ${u.active!==false?'selected':''}>Active</option><option value="0" ${u.active===false?'selected':''}>Disabled</option></select></td></tr>`}).join('')}</table></div></div>`;

function rfV(s){return `<div class="modal" data-a="closerc"><div class="card rc" style="max-width:420px;font-family:inherit"><h3>Refund · ${s.no}</h3><p class="mu sm">Enter the quantity to refund for each item.</p>
<form class="fm" data-s="refund">${s.items.map(i=>{const mx=i.qty-refd(s.id,i.id);return `<label style="display:grid;grid-template-columns:1fr 80px;gap:8px;align-items:center;color:var(--tx)"><span>${esc(i.name)}<br><span class="sm mu">${cur(i.price)} · ${mx} of ${i.qty} refundable</span></span><input type="number" name="q_${i.id}" min="0" max="${mx}" value="0" ${mx?'':'disabled'}></label>`}).join('')}
<input name="reason" placeholder="Reason for refund (required)" required><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" name="restock" checked> Return items to stock</label>
<div style="display:flex;gap:8px"><button class="p" style="flex:1">Process refund</button><button type="button" style="flex:1" data-a="closerc" data-id="x">Cancel</button></div></form></div></div>`}
function rcptV(s){const c=st.cfg;return `<div class="modal" data-a="closerc"><div class="card rc" id="rcpt"><div class="ctr"><b style="font-size:16px">${esc(c.name||'Receipt')}</b><br>${esc(c.addr||'')}${c.tel?'<br>Tel: '+esc(c.tel):''}<br>${esc(bname(s.branch))}</div><hr>
${s.refund?'<div class="ctr"><b>REFUND RECEIPT</b></div>':''}<div class="rw"><span>${s.refund?'Refund no.':'Receipt'}</span><span>${s.no}</span></div>${s.refund?`<div class="rw"><span>Original sale</span><span>${s.saleNo}</span></div>`:''}<div class="rw"><span>Date</span><span>${new Date(ms(s.ts)).toLocaleString()}</span></div><div class="rw"><span>Cashier</span><span>${esc(s.uname)}</span></div><div class="rw"><span>Sale type</span><span>${s.mode}</span></div>${s.customer?`<div class="rw"><span>Customer</span><span>${esc(s.customer)}</span></div>`:''}<hr>
${s.items.map(i=>`<div>${esc(i.name)}</div><div class="rw"><span>${i.qty} × ${cur(i.price)}</span><span>${cur(i.qty*i.price)}</span></div>`).join('')}<hr>
<div class="rw"><b>${s.refund?'REFUND TOTAL':'TOTAL'}</b><b>${s.refund?'-':''}${cur(s.total)}</b></div><div class="rw"><span>${s.refund?'Refunded via':'Paid by'}</span><span>${esc(s.pay)}</span></div>${s.refund&&s.reason?`<div>Reason: ${esc(s.reason)}</div>`:''}${s.tend&&!s.refund?`<div class="rw"><span>Received</span><span>${cur(s.tend)}</span></div><div class="rw"><span>Change</span><span>${cur(s.tend-s.total)}</span></div>`:''}<hr><div class="ctr">${esc(c.foot??'Thank you for shopping with us!')}</div>
<div class="noprint" style="display:flex;gap:8px;margin-top:14px"><button class="p" style="flex:1" data-a="print">Print</button><button style="flex:1" data-a="closerc" data-id="x">Close</button></div></div></div>`}

function render(){const a=$('app');document.title=appName();if(!auth)return;
 if(st.me===undefined){a.innerHTML='<p class="mu" style="padding:24px">Loading…</p>';return}
 if(!st.me){a.innerHTML=authV();$('m').innerHTML='';return}
 if(!(st.me.role&&st.me.active!==false&&(isAdmin()||st.me.branch))){a.innerHTML=waitV();return}
 if(!tabs().some(t=>t[0]===st.tab))st.tab='pos';
 const hdr=`<header><b>${logo(26)}${esc(appName())}</b>${isAdmin()?`<select data-c="view" aria-label="Branch">${st.branches.map(b=>`<option value="${b.id}" ${st.view===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}${st.tab==='sales'?`<option value="all" ${st.view==='all'?'selected':''}>All branches</option>`:''}</select>`:`<span>${esc(bname(st.me.branch))}</span>`}<span class="sm mu">${esc(st.me.name)} · ${st.me.role}</span><button data-a="out">Log out</button></header>
<nav>${tabs().map(t=>`<button class="${st.tab===t[0]?'on':''}" data-a="tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</nav>`;
 const f=document.activeElement,keep=f&&f.id==='qs';
 a.innerHTML=hdr+'<main>'+({pos:posV,sales:salesV,products:prodV,branches:branchV,users:usersV}[st.tab])()+'</main>';
 $('m').innerHTML=st.rc?rcptV(st.rc):st.rf?rfV(st.rf):'';
 if(keep){const i=$('qs');i.focus();i.setSelectionRange(st.q.length,st.q.length)}}

/* ---------- actions ---------- */
const A={
 am:id=>{st.am=id;render()},out:()=>signOut(auth),print:()=>window.print(),
 reset:async()=>{const e=prompt('Enter your account email');if(e)try{await sendPasswordResetEmail(auth,e);toast('Password reset email sent.')}catch(x){toast(x.message)}},
 tab:id=>{st.tab=id;if(st.view==='all'&&id!=='sales'){st.view=st.branches[0]?.id;watchBranch()}render()},
 mode:id=>{st.mode=id;st.cart.forEach(c=>delete c.price);render()},
 add:id=>{const c=st.cart.find(x=>x.id===id);c?c.qty++:st.cart.push({id,qty:1});render()},
 rm:id=>{st.cart=st.cart.filter(x=>x.id!==id);render()},
 edit:id=>{st.ed=id||null;render();scrollTo(0,0)},
 rcpt:id=>{st.rc=st.sales.find(s=>s.id===id);render()},
 closerc:(id,t,e)=>{if(e.target===t||id==='x'){st.rc=null;st.rf=null;render()}},
 rfopen:id=>{st.rf=st.sales.find(s=>s.id===id);render()},
 rrcpt:id=>{st.rc={...st.refunds.find(r=>r.id===id),refund:true};render()},
 delp:async id=>{if(confirm('Delete this product?'))try{await deleteDoc(doc(db,'products',id))}catch(e){toast(e.message)}},
 renb:async id=>{const n=prompt('Branch name',bname(id));if(n?.trim())try{await updateDoc(doc(db,'branches',id),{name:n.trim()})}catch(e){toast(e.message)}},
 delb:async id=>{if(st.users.some(u=>u.branch===id))return toast('Reassign this branch\'s staff first.');if(confirm('Delete this branch?'))try{await deleteDoc(doc(db,'branches',id))}catch(e){toast(e.message)}},
 async checkout(){const b=brId(),m=st.mode,cu=($('cu')?.value||'').trim();
  if(!st.cart.length)return toast('Cart is empty.');
  for(const c of st.cart){const p=prod(c.id);if(c.qty<1)return toast(`${p.name}: quantity must be at least 1.`);if(c.qty>stock(p.id))return toast(`${p.name}: only ${stock(p.id)} in stock.`);if(up(c)<minp(p))return toast(`${p.name}: lowest ${m} price is ${cur(minp(p))}.`)}
  if(m==='wholesale'&&!cu)return toast('Enter the wholesale customer name.');
  const items=st.cart.map(c=>({id:c.id,name:prod(c.id).name,qty:c.qty,price:up(c)})),tend=+$('tend').value||0;
  const s={no:'R'+Date.now().toString(36).toUpperCase().slice(-7),branch:b,uid:st.uid,uname:st.me.name,mode:m,customer:cu,pay:$('pay').value,tend,items,total:total()};
  try{const batch=writeBatch(db);batch.set(doc(collection(db,'sales')),{...s,ts:serverTimestamp()});
   items.forEach(i=>batch.set(doc(db,'stock',b+'_'+i.id),{branch:b,product:i.id,qty:increment(-i.qty)},{merge:true}));
   await batch.commit();st.cart=[];st.rc={...s,ts:Date.now()};render()}catch(e){toast('Sale failed: '+e.message)}}};
const C={
 uprice:(id,v)=>{st.cart.find(x=>x.id===id).price=Math.max(0,+v||0);render()},
 qty:(id,v)=>{st.cart.find(x=>x.id===id).qty=Math.max(0,parseInt(v)||0);render()},
 view:(_,v)=>{st.view=v;watchBranch();render()},
 stock:async(id,v)=>{const b=brId();try{await setDoc(doc(db,'stock',b+'_'+id),{branch:b,product:id,qty:Math.max(0,parseInt(v)||0)},{merge:true});toast('Stock updated.')}catch(e){toast(e.message)}},
 role:(id,v)=>upd(id,{role:v||null,...(v==='admin'?{branch:null}:{})}),ubranch:(id,v)=>upd(id,{branch:v||null}),active:(id,v)=>upd(id,{active:v==='1'})};
const upd=async(id,d)=>{try{await updateDoc(doc(db,'users',id),d)}catch(e){toast(e.message)}};
const F={
 async auth(f){const d=Object.fromEntries(new FormData(f));try{
  if(st.am==='up'){const r=await createUserWithEmailAndPassword(auth,d.e,fp(d.p));await setDoc(doc(db,'users',r.user.uid),{name:d.n.trim(),email:d.e,role:null,branch:null,active:true,created:serverTimestamp()})}
  else await signInWithEmailAndPassword(auth,d.e,fp(d.p))}catch(e){toast(e.code==='auth/weak-password'?'Firebase Authentication requires at least 6 characters.':e.message.replace('Firebase: ',''))}},
 async prod(f){const d=Object.fromEntries(new FormData(f)),r=d.id?doc(db,'products',d.id):doc(collection(db,'products'));
  const rmp=d.rmp===''?+d.rp:+d.rmp,wmp=d.wmp===''?+d.wp:+d.wmp;if(rmp>+d.rp||wmp>+d.wp)return toast('A minimum price cannot be higher than its selling price.');
  try{await setDoc(r,{name:d.name.trim(),sku:d.sku.trim(),rp:+d.rp,rmp,wp:+d.wp,wmp});const b=brId();if(d.qty!==undefined&&b&&b!=='all')await setDoc(doc(db,'stock',b+'_'+r.id),{branch:b,product:r.id,qty:Math.max(0,parseInt(d.qty)||0)},{merge:true});st.ed=null;toast('Product saved.')}catch(e){toast(e.message)}},
 async branch(f){try{await addDoc(collection(db,'branches'),{name:new FormData(f).get('n').trim()});f.reset()}catch(e){toast(e.message)}},
 async refund(f){const s=st.rf,d=new FormData(f),b=s.branch;
  const items=s.items.map(i=>({id:i.id,name:i.name,price:i.price,qty:parseInt(d.get('q_'+i.id))||0})).filter(i=>i.qty>0);
  if(!items.length)return toast('Enter a quantity to refund.');
  for(const i of items){const o=s.items.find(x=>x.id===i.id);if(i.qty>o.qty-refd(s.id,i.id))return toast(`${i.name}: refund exceeds quantity sold.`)}
  const r={sale:s.id,saleNo:s.no,no:'F'+Date.now().toString(36).toUpperCase().slice(-7),branch:b,uid:st.uid,uname:st.me.name,mode:s.mode,customer:s.customer||'',pay:s.pay,items,total:items.reduce((a,i)=>a+i.qty*i.price,0),reason:d.get('reason').trim(),restock:!!d.get('restock')};
  try{const batch=writeBatch(db);batch.set(doc(collection(db,'refunds')),{...r,ts:serverTimestamp()});
   if(r.restock)items.forEach(i=>batch.set(doc(db,'stock',b+'_'+i.id),{branch:b,product:i.id,qty:increment(i.qty)},{merge:true}));
   await batch.commit();st.rf=null;st.rc={...r,ts:Date.now(),refund:true};render()}catch(e){toast('Refund failed: '+e.message)}},
 async cfg(f){try{await setDoc(doc(db,'settings','shop'),Object.fromEntries(new FormData(f)));toast('Saved.')}catch(e){toast(e.message)}}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.tagName==='A')e.preventDefault();A[t.dataset.a]?.(t.dataset.id,t,e)});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.s){e.preventDefault();F[f.dataset.s](f)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.c)C[t.dataset.c](t.dataset.id,t.value)});
document.addEventListener('input',e=>{if(e.target.dataset.i==='q'){st.q=e.target.value;$('gr').innerHTML=gridV()}});
render();
</script></body></html>
